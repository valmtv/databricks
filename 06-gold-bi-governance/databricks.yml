bundle:
  name: lab06_gold_bi_governance

include: []

resources:
  # ---------------------------------------------------------------------------
  # 1. Declarative Lakeflow Pipeline (Bronze -> Silver -> Gold Star Schema)
  # ---------------------------------------------------------------------------
  pipelines:
    air_quality_lakeflow_pipeline:
      name: "[${bundle.target}] Air Quality Full Medallion (Bronze-Silver-Gold) Lakeflow Pipeline"
      edition: ADVANCED
      channel: CURRENT
      continuous: false
      photon: true
      libraries:
        - file:
            path: ./01_bronze_ingestion.py
        - file:
            path: ./02_silver_transformations.py
        - file:
            path: ./03_gold_star_schema.py
      configuration:
        bundle.sourcePath: ${workspace.file_path}

  # ---------------------------------------------------------------------------
  # 2. Decoupled Workflow Jobs (Architecture: Infrastructure vs ETL vs Audits)
  # ---------------------------------------------------------------------------
  jobs:
    # -------------------------------------------------------------------------
    # LIFECYCLE 1: Infrastructure & Governance Setup (DDL / Run-Once / Migration)
    # Provisions schema objects, Delta constraints, UC RLS/CLS, and scorecard views.
    # -------------------------------------------------------------------------
    air_quality_infrastructure_setup:
      name: "[${bundle.target}] Air Quality Infrastructure & Governance Setup (DDL)"
      tasks:
        # Task 1: Generate conformed calendar date dimension table
        - task_key: generate_dim_date
          notebook_task:
            notebook_path: ./00b_generate_dim_date.sql

        # Task 2: Apply Delta Lake table-level invariants & check constraints
        - task_key: delta_table_constraints
          depends_on:
            - task_key: generate_dim_date
          notebook_task:
            notebook_path: ./08_delta_table_constraints.py

        # Task 3: Apply Unity Catalog Governance (Row Filters & Column Masks)
        - task_key: governance_rls_cls
          depends_on:
            - task_key: delta_table_constraints
          notebook_task:
            notebook_path: ./04_governance_rls_cls.sql

        # Task 4: Deploy Data Quality Scorecard views & alert thresholds
        - task_key: dq_scorecard_and_alerts
          depends_on:
            - task_key: governance_rls_cls
          notebook_task:
            notebook_path: ./09_dq_scorecard_and_alerts.sql

    # -------------------------------------------------------------------------
    # LIFECYCLE 2: Pure Data Loading Pipeline (Stateless ETL / Scheduled)
    # The actual data movement: only loads, cleans, and aggregates data.
    # -------------------------------------------------------------------------
    air_quality_data_pipeline:
      name: "[${bundle.target}] Air Quality Data Loading Pipeline (ETL)"
      tasks:
        # Task 1: Stage landing telemetry data
        - task_key: setup_landing_data
          notebook_task:
            notebook_path: ./00_setup_landing_data.ipynb

        # Task 2: Declarative Lakeflow Pipeline (Bronze -> Silver -> Gold)
        - task_key: lakeflow_pipeline
          depends_on:
            - task_key: setup_landing_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.air_quality_lakeflow_pipeline.id}

    # -------------------------------------------------------------------------
    # LIFECYCLE 3: Quality & Audit Suite (Verification, Reconciliation & DQX)
    # Independent verification lifecycle: CI/CD test gates & operational audits.
    # -------------------------------------------------------------------------
    air_quality_quality_and_audit_suite:
      name: "[${bundle.target}] Air Quality Quality & Reconciliation Audit Suite"
      tasks:
        # Task 1: Medallion Cross-Layer Reconciliation Audit Gate
        - task_key: dq_reconciliation_audit
          notebook_task:
            notebook_path: ./run_dq_reconciliation.py

        # Task 2: Databricks Labs DQX Declarative Quality Suite
        - task_key: dqx_quality_engine
          depends_on:
            - task_key: dq_reconciliation_audit
          notebook_task:
            notebook_path: ./10_dqx_quality_engine.py

        # Task 3: Volume Drop & SLA Monitoring Alerts
        - task_key: alerts_monitoring
          depends_on:
            - task_key: dqx_quality_engine
          notebook_task:
            notebook_path: ./05_alerts_and_monitoring.sql

targets:
  # Target 1: Databricks Free Trial Edition (Serverless Workspace with Unity Catalog)
  dev_free:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      dashboards:
        air_quality_executive_bi_dashboard:
          display_name: "[${bundle.target}] Air Quality Executive BI & Global Environmental Observatory"
          file_path: ./06_dashboard/air_quality_executive_bi.lvdash.json
          warehouse_id: 2035b157781cb38f
      pipelines:
        air_quality_lakeflow_pipeline:
          serverless: true
          catalog: workspace
          target: default
          configuration:
            pipeline.landing_path: "/Workspace/Users/${workspace.current_user.userName}/air_quality_landing/landing"
      jobs:
        # 1. Infrastructure Setup Job
        air_quality_infrastructure_setup:
          tasks:
            - task_key: generate_dim_date
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: delta_table_constraints
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: governance_rls_cls
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: dq_scorecard_and_alerts
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default

        # 2. Data Loading Pipeline Job
        air_quality_data_pipeline:
          tasks:
            - task_key: setup_landing_data
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
                  volume: air_quality_landing
                  custom_landing_path: "/Workspace/Users/${workspace.current_user.userName}/air_quality_landing"

        # 3. Quality & Audit Suite Job
        air_quality_quality_and_audit_suite:
          tasks:
            - task_key: dq_reconciliation_audit
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: dqx_quality_engine
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: alerts_monitoring
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default

  # Target 2: Azure Databricks Production with Unity Catalog (Zero Serverless, GP1 Cluster Reuse)
  prod_azure:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      dashboards:
        air_quality_executive_bi_dashboard:
          display_name: "[${bundle.target}] Air Quality Executive BI & Global Environmental Observatory"
          file_path: ./06_dashboard/air_quality_executive_bi.lvdash.json
          warehouse_id: 3ed106620db591d9
      pipelines:
        air_quality_lakeflow_pipeline:
          serverless: false
          catalog: dbr_dev
          target: valeriimatviiv_gold
          configuration:
            pipeline.landing_path: "/Volumes/dbr_dev/valeriimatviiv_bronze/air_quality_landing/landing"
      jobs:
        # 1. Infrastructure Setup Job
        air_quality_infrastructure_setup:
          tasks:
            - task_key: generate_dim_date
              existing_cluster_id: 0702-132442-toro5spu
