bundle:
  name: lab06_gold_bi_governance

include: []

resources:
  # ---------------------------------------------------------------------------
  # 1. Declarative Lakeflow Pipeline (Bronze -> Silver -> Gold Star Schema)
  # ---------------------------------------------------------------------------
  pipelines:
    air_quality_lakeflow_pipeline:
      name: "[${bundle.target}] Air Quality Full Medallion (Bronze-Silver-Gold) Lakeflow Pipeline"
      edition: ADVANCED
      channel: CURRENT
      continuous: false
      photon: true
      libraries:
        - file:
            path: ./01_bronze_ingestion.py
        - file:
            path: ./02_silver_transformations.py
        - file:
            path: ./03_gold_star_schema.py
      configuration:
        bundle.sourcePath: ${workspace.file_path}

  # ---------------------------------------------------------------------------
  # 2. End-to-End Orchestrated Workflow Job
  # Chaining: Landing Setup -> Lakeflow Pipeline -> RLS/CLS Governance -> Alerts
  # ---------------------------------------------------------------------------
  jobs:
    air_quality_daily_workflow:
      name: "[${bundle.target}] Air Quality Daily End-to-End Workflow"
      tasks:
        # Task 1: Setup landing telemetry & EPA reference standards
        - task_key: setup_landing_data
          notebook_task:
            notebook_path: ./00_setup_landing_data.ipynb

        # Task 2: Declarative Lakeflow Pipeline (Bronze -> Silver -> Gold)
        - task_key: lakeflow_pipeline
          depends_on:
            - task_key: setup_landing_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.air_quality_lakeflow_pipeline.id}

        # Task 3: Lab 07 - Delta Lake Table-Level Constraints Defense-in-Depth
        - task_key: delta_table_constraints
          depends_on:
            - task_key: lakeflow_pipeline
          notebook_task:
            notebook_path: ./08_delta_table_constraints.py

        # Task 4: Apply Unity Catalog Governance (RLS/CLS)
        - task_key: governance_rls_cls
          depends_on:
            - task_key: delta_table_constraints
          notebook_task:
            notebook_path: ./04_governance_rls_cls.sql

        # Task 5: Automated Data Quality & Volume Drop Alert Check
        - task_key: alerts_monitoring
          depends_on:
            - task_key: governance_rls_cls
          notebook_task:
            notebook_path: ./05_alerts_and_monitoring.sql

        # Task 6: Lab 07 - Data Quality Scorecard & Alerts
        - task_key: dq_scorecard_and_alerts
          depends_on:
            - task_key: alerts_monitoring
          notebook_task:
            notebook_path: ./09_dq_scorecard_and_alerts.sql

        # Task 7: Lab 07 - Medallion Cross-Layer Reconciliation Audit Gate
        - task_key: dq_reconciliation_audit
          depends_on:
            - task_key: dq_scorecard_and_alerts
          notebook_task:
            notebook_path: ./run_dq_reconciliation.py

targets:
  # Target 1: Databricks Free Trial Edition (Serverless Workspace with Unity Catalog)
  dev_free:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      dashboards:
        air_quality_executive_bi_dashboard:
          display_name: "[${bundle.target}] Air Quality Executive BI & Global Environmental Observatory"
          file_path: ./06_dashboard/air_quality_executive_bi.lvdash.json
          warehouse_id: 2035b157781cb38f
      pipelines:
        air_quality_lakeflow_pipeline:
          serverless: true
          catalog: workspace
          target: default
          configuration:
            pipeline.landing_path: "/Workspace/Users/${workspace.current_user.userName}/air_quality_landing/landing"
      jobs:
        air_quality_daily_workflow:
          tasks:
            - task_key: setup_landing_data
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
                  volume: air_quality_landing
                  custom_landing_path: "/Workspace/Users/${workspace.current_user.userName}/air_quality_landing"
            - task_key: delta_table_constraints
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: governance_rls_cls
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: alerts_monitoring
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: dq_scorecard_and_alerts
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default
            - task_key: dq_reconciliation_audit
              notebook_task:
                base_parameters:
                  catalog: workspace
                  schema: default

  # Target 2: Azure Databricks Production with Unity Catalog (Classic DLT Compute, GP1 Cluster)
  prod_azure:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      dashboards:
        air_quality_executive_bi_dashboard:
          display_name: "[${bundle.target}] Air Quality Executive BI & Global Environmental Observatory"
