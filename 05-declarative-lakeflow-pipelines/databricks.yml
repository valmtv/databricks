bundle:
  name: lab05_declarative_lakeflow

include: []

resources:
  pipelines:
    air_quality_lakeflow_pipeline:
      name: "[${bundle.target}] Air Quality Lakeflow Declarative Pipeline"
      edition: PRO
      channel: CURRENT
      continuous: false
      photon: true
      clusters:
        - label: default
          num_workers: 1
      libraries:
        - file:
            path: ./01_bronze_ingestion.py
        - file:
            path: ./02_silver_transformations.py
      configuration:
        bundle.sourcePath: ${workspace.file_path}

targets:
  # Target 1: Databricks Free Trial Edition (Serverless Workspace with Unity Catalog)
  dev_free:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      pipelines:
        air_quality_lakeflow_pipeline:
          serverless: true
          catalog: workspace
          target: default
          configuration:
            pipeline.landing_path: "/Workspace/Users/${workspace.current_user.userName}/air_quality_landing/landing"

  # Target 2: Azure Databricks Production with Unity Catalog (Classic DLT Compute, No Serverless)
  prod_azure:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      pipelines:
        air_quality_lakeflow_pipeline:
          serverless: false
          catalog: dbr_dev
          target: valeriimatviiv_silver
          configuration:
            pipeline.landing_path: "/Volumes/dbr_dev/valeriimatviiv_bronze/air_quality_landing/landing"
