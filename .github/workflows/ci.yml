name: CI - Medallion Unit Tests & Bundle Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Run Unit Tests & Validate Bundle
    runs-on: ubuntu-latest
    env:
      # Exclusively use DATABRICKS_DEV_FREE_TOKEN
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_FREE_TOKEN }}
      DATABRICKS_HOST: "https://dbc-3d34d2aa-8db9.cloud.databricks.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Transformation & Data Quality Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/06-gold-bi-governance
        run: |
          echo "=== Running Air Quality Medallion Unit Tests (Local Runner) ==="
          python -m unittest discover -s 06-gold-bi-governance/tests -p "test_*.py" -v

      - name: Install Databricks CLI
        if: env.DATABRICKS_TOKEN != ''
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Databricks Asset Bundle (dev_free)
        if: env.DATABRICKS_TOKEN != ''
        run: |
          cd 06-gold-bi-governance
          echo "=== Validating Asset Bundle for dev_free ==="
          databricks bundle validate -t dev_free

      - name: Notice on Databricks Asset Bundle Validation
        if: env.DATABRICKS_TOKEN == ''
        run: |
          echo "[INFO] Local unit tests passed. To enable live Databricks Asset Bundle validation against dev_free in GitHub Actions, ensure 'DATABRICKS_DEV_FREE_TOKEN' is set in GitHub Repository Secrets."
