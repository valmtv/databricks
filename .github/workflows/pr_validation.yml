name: CI - Pull Request Verification & Safety Gates

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Pure Python Transformation & Data Quality Unit Tests
  # Runs locally on GitHub Actions runner with zero cloud compute / zero cost.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Transformation Unit Tests (Zero-Compute Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          pip install --upgrade pip
          if [ -f 06-gold-bi-governance/requirements-test.txt ]; then
            pip install -r 06-gold-bi-governance/requirements-test.txt
          fi

      - name: Run Air Quality Pure Transformation Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/06-gold-bi-governance
        run: |
          echo "================================================================="
          echo " Running 28 Medallion Pure Transformation Unit Tests"
          echo "================================================================="
          python -m unittest discover -s 06-gold-bi-governance/tests -p "test_*.py" -v

  # ---------------------------------------------------------------------------
  # Gate 2: Databricks Asset Bundle Cross-Target Validation (dev_free & prod_azure)
  # Verifies YAML schemas, resource references, DDL paths, and permissions.
  # ---------------------------------------------------------------------------
  bundle-validate:
    name: DAB Multi-Target Schema & Resource Validation
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.231.0

      - name: Validate Asset Bundle for dev_free
        env:
          DATABRICKS_HOST: "https://dbc-3d34d2aa-8db9.cloud.databricks.com"
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_FREE_TOKEN }}
        run: |
          echo "=== Validating Asset Bundle: target = dev_free ==="
          cd 06-gold-bi-governance
          databricks bundle validate -t dev_free

      - name: Validate Asset Bundle for prod_azure
        env:
          DATABRICKS_HOST: "https://adb-7405604503619901.1.azuredatabricks.net"
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_AZURE_TOKEN }}
        run: |
          echo "=== Validating Asset Bundle: target = prod_azure ==="
          cd 06-gold-bi-governance
          databricks bundle validate -t prod_azure

  # ---------------------------------------------------------------------------
  # Gate 3: Terraform Infrastructure as Code Syntax & Configuration Check
  # Validates Azure Lakehouse & Unity Catalog resource definitions.
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Azure Lakehouse IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Check Terraform Formatting
        run: |
          cd terraform
          terraform fmt -check

      - name: Initialize Terraform (No-Backend Validation)
        run: |
          cd terraform
          terraform init -backend=false

      - name: Validate Terraform Configuration
        run: |
          cd terraform
          terraform validate

  # ---------------------------------------------------------------------------
  # Gate 4: Databricks Platform Automation & Cost Guardrail (Lab 9 CI Integration)
  # Verifies the PlatformClient, CLI syntax, and cost-protection guardrails.
  # ---------------------------------------------------------------------------
  platform-ops-verify:
    name: Platform Ops SDK & REST API Safety Verification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Platform Dependencies
        run: |
          pip install -r platform_ops/requirements.txt

      - name: Verify Cost Guardrail Unit Test
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'platform_ops')
          from client import PlatformClient, SafetyGuardrailError
          client = PlatformClient(target='prod_azure')
          try:
              client.trigger_job(job_id=999999)
              print('Guardrail check FAILED: allowed prod_azure trigger')
              sys.exit(1)
          except SafetyGuardrailError:
              print('Guardrail check PASSED: successfully blocked prod_azure job execution')
          "

      - name: CLI Syntax & Module Verification
        run: |
          python3 platform_ops/lakehouse_ops.py --help
          python3 platform_ops/e2e_platform_run.py --help
